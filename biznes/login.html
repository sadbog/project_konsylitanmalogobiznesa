<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Вход — БизнесПро</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo"><span class="logo__mark">БП</span><span class="logo__name">БизнесПро</span></a>
    <div class="nav__actions">
      <a href="register.html" class="btn btn--primary btn--sm">Регистрация</a>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo"><span class="logo__mark">БП</span><span>БизнесПро</span></div>
    <h1 class="auth-card__title">Добро пожаловать</h1>
    <p class="auth-card__sub">Войдите в свой личный кабинет</p>

    <div class="alert alert--info">💡 Выберите роль для демонстрации перехода в нужный кабинет</div>

    <!-- Клиент -->
    <form action="client-dashboard.html" method="get">
      <div class="form-group"><label>Email</label><input type="email" value="client@bizpro.ru"/></div>
      <div class="form-group"><label>Пароль</label><input type="password" value="••••••••"/></div>
      <button type="submit" class="btn btn--primary btn--full">Войти как Клиент</button>
    </form>

    <div class="auth-divider">или</div>

    <!-- Консультант -->
    <form action="consultant-dashboard.html" method="get" style="margin-bottom:10px">
      <button type="submit" class="btn btn--ghost btn--full">Войти как Консультант</button>
    </form>

    <!-- Администратор -->
    <form action="admin-dashboard.html" method="get">
      <button type="submit" class="btn btn--ghost btn--full">Войти как Администратор</button>
    </form>

    <div class="auth-card__footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
  </div>
</div>
</body>
</html>
