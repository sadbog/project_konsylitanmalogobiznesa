<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Оформление заказа — БизнесПро</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo"><span class="logo__mark">БП</span><span class="logo__name">БизнесПро</span></a>
    <div class="nav__actions">
      <a href="cart.html" class="cart-btn">🛒 Корзина <span class="cart-badge">2</span></a>
    </div>
  </div>
</header>
<div class="page">
  <div class="cart-page">
    <h1>Оформление заказа</h1>
    <div class="cart-layout">
      <div>
        <div class="profile-card">
          <h2>Контактные данные</h2>
          <div class="profile-grid">
            <div class="form-group"><label>Имя *</label><input type="text" placeholder="Иван" value="Иван"/></div>
            <div class="form-group"><label>Фамилия *</label><input type="text" placeholder="Иванов" value="Иванов"/></div>
          </div>
          <div class="form-group"><label>Email *</label><input type="email" value="ivan@mail.ru"/></div>
          <div class="form-group"><label>Телефон *</label><input type="tel" value="+7 (900) 123-45-67"/></div>
        </div>
        <div class="profile-card">
          <h2>Способ оплаты</h2>
          <div style="display:flex;flex-direction:column;gap:10px">
            <label style="display:flex;align-items:center;gap:10px;padding:14px;border:1.5px solid var(--accent);border-radius:8px;cursor:pointer;background:var(--accent-lt)">
              <input type="radio" name="pay" checked/> 💳 Банковская карта
            </label>
            <label style="display:flex;align-items:center;gap:10px;padding:14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer">
              <input type="radio" name="pay"/> 🏦 Расчётный счёт (для ИП/ООО)
            </label>
            <label style="display:flex;align-items:center;gap:10px;padding:14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer">
              <input type="radio" name="pay"/> 📱 СБП (по номеру телефона)
            </label>
          </div>
        </div>
      </div>
      <div>
        <div class="cart-summary">
          <div class="cart-summary__title">Ваш заказ</div>
          <div class="cart-summary__row"><span>Тариф «Рост»</span><span>25 000 ₽</span></div>
          <div class="cart-summary__row"><span>Тариф «Старт»</span><span>5 000 ₽</span></div>
          <div class="cart-summary__total"><span>Итого</span><span>30 000 ₽</span></div>
          <a href="client-dashboard.html" class="btn btn--primary btn--full">✅ Подтвердить оплату</a>
          <p style="text-align:center;font-size:.75rem;color:var(--muted);margin-top:12px">🔒 Защищённое соединение · 152-ФЗ</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
