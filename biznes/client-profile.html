<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Профиль — БизнесПро</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo"><span class="logo__mark">БП</span><span class="logo__name">БизнесПро</span></a>
    <div class="nav__actions">
      <a href="cart.html" class="cart-btn">🛒 Корзина <span class="cart-badge">1</span></a>
      <div class="user-menu"><div class="user-avatar">ИИ</div><span class="user-menu__name">Иван Иванов</span></div>
      <a href="index.html" class="btn btn--ghost btn--sm">Выйти</a>
    </div>
  </div>
</header>
<div class="page">
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar__user">
        <div class="sidebar__avatar">ИИ</div>
        <div class="sidebar__name">Иван Иванов</div>
        <div class="sidebar__role">👤 Клиент</div>
      </div>
      <nav class="sidebar__nav">
        <a href="client-dashboard.html" class="sidebar__link"><span class="icon">📋</span>Мои заявки</a>
        <a href="cart.html"             class="sidebar__link"><span class="icon">🛒</span>Корзина</a>
        <a href="client-profile.html"   class="sidebar__link sidebar__link--active"><span class="icon">👤</span>Профиль</a>
        <a href="index.html"            class="sidebar__link"><span class="icon">🏠</span>На главную</a>
      </nav>
    </aside>
    <main class="dash-content">
      <div class="dash-header"><h1>Мой профиль</h1></div>
      <div class="profile-card">
        <h2>Личные данные</h2>
        <div class="profile-grid">
          <div class="form-group"><label>Имя</label><input type="text" value="Иван"/></div>
          <div class="form-group"><label>Фамилия</label><input type="text" value="Иванов"/></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" value="ivan@mail.ru"/></div>
        <div class="form-group"><label>Телефон</label><input type="tel" value="+7 (900) 123-45-67"/></div>
        <div class="form-group"><label>О себе / бизнес</label><textarea>Владелец небольшого магазина одежды в Волгограде. Хочу масштабировать бизнес.</textarea></div>
        <a href="#" class="btn btn--primary">Сохранить изменения</a>
      </div>
      <div class="profile-card">
        <h2>Смена пароля</h2>
        <div class="form-group"><label>Текущий пароль</label><input type="password" placeholder="••••••••"/></div>
        <div class="form-group"><label>Новый пароль</label><input type="password" placeholder="Минимум 6 символов"/></div>
        <div class="form-group"><label>Повторите пароль</label><input type="password" placeholder="Повторите новый пароль"/></div>
        <a href="#" class="btn btn--ghost">Изменить пароль</a>
      </div>
    </main>
  </div>
</div>
</body>
</html>
